name: CI

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://stand_test:stand_test@localhost:5432/the_stand_test
      TEST_DATABASE_URL: postgresql://stand_test:stand_test@localhost:5432/the_stand_test
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_stand_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stand_test -d the_stand_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Provision non-superuser test database role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d the_stand_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'stand_test') THEN
              CREATE ROLE stand_test LOGIN PASSWORD 'stand_test' NOSUPERUSER;
            END IF;
          END
          $$;
          ALTER ROLE stand_test LOGIN PASSWORD 'stand_test' NOSUPERUSER;
          ALTER DATABASE the_stand_test OWNER TO stand_test;
          GRANT ALL ON SCHEMA public TO stand_test;
          SQL

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check dependency graph
        run: npm run docs:dependencies:check

      - name: Validate translation catalogs
        run: npm run i18n:validate

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
