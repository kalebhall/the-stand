name: Deploy The Stand

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy dev from main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, the-stand-dev]
    timeout-minutes: 30
    concurrency:
      group: the-stand-dev-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy main
        run: sudo /opt/the-stand/deploy.sh

  deploy-production:
    name: Deploy production release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: [self-hosted, linux, the-stand-production]
    timeout-minutes: 30
    concurrency:
      group: the-stand-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy release tag
        run: sudo /opt/the-stand/deploy.sh
